apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: gpu-operator-clusterpolicy-creation
  annotations:
    helm.sh/resource-policy: keep
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: nvidia.com/v1alpha1
    kind: GPUCluster
  matchConstraints:
    resourceRules:
    - apiGroups: ["nvidia.com"]
      apiVersions: ["v1"]
      operations: ["CREATE"]
      resources: ["clusterpolicies"]
      scope: Cluster
  validations:
  - expression: "false"
    message: "Cannot create ClusterPolicy while GPUCluster exists."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: gpu-operator-clusterpolicy-creation
  annotations:
    helm.sh/resource-policy: keep
spec:
  policyName: gpu-operator-clusterpolicy-creation
  validationActions: [Deny]
  paramRef:
    selector: {}
    parameterNotFoundAction: Allow
